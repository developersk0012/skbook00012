<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Materials - SK Education</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 50%, #2d1b69 100%); min-height: 100vh; color: white; }

        .main-container { max-width: 800px; margin: 0 auto; padding: 20px 25px 40px; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 25px; background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 25px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #4361ee, #f72585); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: white; }
        .header-left h2 { font-size: 20px; color: white; margin: 0; }
        .header-left small { color: #a5b4fc; font-size: 13px; display: block; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-badge { background: rgba(67,97,238,0.2); padding: 6px 18px; border-radius: 50px; font-size: 14px; color: #a5b4fc; border: 1px solid rgba(67,97,238,0.15); }
        .icon-btn { background: rgba(255,255,255,0.06); padding: 8px 14px; border-radius: 50px; text-decoration: none; color: #a5b4fc; font-size: 18px; transition: all .2s; }
        .icon-btn:hover { background: rgba(255,255,255,0.12); color: white; }
        .logout-link { background: none; border: none; color: #f72585; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 50px; transition: all .2s; }
        .logout-link:hover { background: rgba(247,37,133,0.15); }

        .search-box { position: relative; margin-bottom: 18px; }
        .search-box input { width: 100%; padding: 13px 18px 13px 42px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 14px; }
        .search-box input:focus { outline: none; border-color: #4361ee; background: rgba(255,255,255,0.08); }
        .search-box input::placeholder { color: #4a5a7a; }
        .search-box .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #6a7a9e; font-size: 16px; pointer-events: none; }

        .tabs { display: flex; gap: 10px; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 6px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.06); }
        .tab { flex: 1; padding: 12px; border: none; border-radius: 10px; background: transparent; color: #a5b4fc; font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s; }
        .tab.active { background: linear-gradient(90deg, #4361ee, #f72585); color: white; }
        .tab:hover:not(.active) { background: rgba(255,255,255,0.06); }

        .material-item { background: rgba(255,255,255,0.04); border-radius: 14px; padding: 18px 20px; margin-bottom: 12px; display: flex; gap: 18px; align-items: flex-start; border: 1px solid rgba(255,255,255,0.05); opacity: 0; animation: itemIn 0.4s ease forwards; }
        .material-item:hover { background: rgba(255,255,255,0.07); }
        .material-icon { font-size: 32px; flex-shrink: 0; }
        .material-info { flex: 1; }
        .material-info h4 { font-size: 17px; margin-bottom: 4px; color: white; }
        .material-info p { color: #a5b4fc; font-size: 14px; margin-bottom: 8px; }
        .material-thumb { max-width: 100%; max-height: 150px; border-radius: 8px; margin-bottom: 8px; }
        .material-btn { display: inline-block; padding: 8px 22px; border-radius: 50px; text-decoration: none; font-size: 14px; font-weight: 600; transition: all .2s; }
        .material-btn:hover { transform: scale(1.03); }
        .pdf-btn { background: linear-gradient(90deg, #4361ee, #3a0ca3); color: white; }
        .video-btn { background: linear-gradient(90deg, #f72585, #c91d6b); color: white; }

        @keyframes itemIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .empty-state { text-align: center; padding: 50px 20px; color: #6a7a9e; font-size: 16px; }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        .loading { text-align: center; padding: 50px 20px; color: #a5b4fc; }
        .spinner { width: 40px; height: 40px; margin: 0 auto 14px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #4cc9f0; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .back-link { display: inline-block; margin-top: 20px; color: #4cc9f0; text-decoration: none; font-size: 15px; }
        .back-link:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .main-container { padding: 15px; }
            .header { flex-direction: column; align-items: stretch; gap: 10px; }
            .header-right { justify-content: center; }
            .tabs { flex-direction: column; }
            .tab { padding: 10px; }
            .material-item { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>
    <div class="main-container">
        
        <!-- HEADER -->
        <div class="header">
            <div class="header-left">
                <div class="logo-icon">SK</div>
                <div>
                    <h2 id="categoryTitle">Loading...</h2>
                    <small id="batchNameDisplay">Loading...</small>
                </div>
            </div>
            <div class="header-right">
                <span class="user-badge" id="userDisplay">👋 User</span>
                <a href="batch.html?batch=" id="backToBatch" class="icon-btn">←</a>
                <button onclick="logout()" class="logout-link">Logout</button>
            </div>
        </div>

        <!-- SEARCH -->
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search materials by title...">
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active" onclick="showTab('pdf', this)">📄 PDFs</button>
            <button class="tab" onclick="showTab('video', this)">🎥 Videos</button>
        </div>

        <!-- PDF CONTENT -->
        <div id="pdfContent" class="tab-content active">
            <div class="loading"><div class="spinner"></div>⏳ Loading PDFs...</div>
        </div>

        <!-- VIDEO CONTENT -->
        <div id="videoContent" class="tab-content">
            <div class="loading"><div class="spinner"></div>⏳ Loading Videos...</div>
        </div>

        <a href="batch.html?batch=" id="backLink" class="back-link">← Back to Subjects</a>
    </div>

    <script>
    // ========================================
    // CHECK LOGIN
    // ========================================
    const userName = getUserName();
    
    if (!userName) {
        window.location.href = 'index.html';
    } else {

    document.getElementById('userDisplay').textContent = '👋 ' + userName;
    watchBlockedStatus();

    // ========================================
    // GET PARAMS
    // ========================================
    const urlParams = new URLSearchParams(window.location.search);
    const batchId = urlParams.get('batch') || '1';
    const catKey = urlParams.get('cat') || 'science';

    const categoryName = CATEGORIES[catKey] || 'Category';
    
    document.getElementById('categoryTitle').textContent = categoryName;
    document.getElementById('backToBatch').href = `batch.html?batch=${batchId}`;
    document.getElementById('backLink').href = `batch.html?batch=${batchId}`;

    // Batch naam Firebase se (naye admin-added batches ke liye bhi kaam karega)
    loadBatches().then(function(batches) {
        const batchName = (batches[batchId] && batches[batchId].name) || 'Batch';
        document.getElementById('batchNameDisplay').textContent = batchName;
    });

    // ========================================
    // LOAD MATERIALS
    // ========================================
    let allPdfs = [];
    let allVideos = [];

    function renderMaterials(filterText) {
        filterText = (filterText || '').toLowerCase().trim();
        const pdfContainer = document.getElementById('pdfContent');
        const videoContainer = document.getElementById('videoContent');

        const filteredPdfs = filterText ? allPdfs.filter(p => (p.title || '').toLowerCase().includes(filterText)) : allPdfs;
        const filteredVideos = filterText ? allVideos.filter(p => (p.title || '').toLowerCase().includes(filterText)) : allVideos;

        function itemHtml(pdf, i) {
            return `
                <div class="material-item" style="animation-delay:${i * 0.05}s">
                    <div class="material-icon">${pdf.type === 'pdf' ? '📄' : '🎥'}</div>
                    <div class="material-info">
                        <h4>${pdf.title || 'Untitled'}</h4>
                        <p>${pdf.description || ''}</p>
                        ${pdf.thumbnail ? `<img src="${pdf.thumbnail}" class="material-thumb" alt="Thumbnail">` : ''}
                        <a href="${pdf.file_path}" target="_blank" class="material-btn ${pdf.type === 'pdf' ? 'pdf-btn' : 'video-btn'}">
                            ${pdf.type === 'pdf' ? '📥 Download PDF' : '▶️ Watch Video'}
                        </a>
                    </div>
                </div>
            `;
        }

        pdfContainer.innerHTML = filteredPdfs.length
            ? filteredPdfs.map(itemHtml).join('')
            : `<div class="empty-state"><span class="icon">📭</span>${filterText ? 'No matching PDFs found' : 'No PDFs available'}</div>`;

        videoContainer.innerHTML = filteredVideos.length
            ? filteredVideos.map(itemHtml).join('')
            : `<div class="empty-state"><span class="icon">🎬</span>${filterText ? 'No matching Videos found' : 'No Videos available'}</div>`;
    }

    function loadMaterials() {
        const pdfContainer = document.getElementById('pdfContent');
        const videoContainer = document.getElementById('videoContent');
        
        pdfContainer.innerHTML = '<div class="loading"><div class="spinner"></div>⏳ Loading PDFs...</div>';
        videoContainer.innerHTML = '<div class="loading"><div class="spinner"></div>⏳ Loading Videos...</div>';

        const timer = withLoadingTimeout(pdfContainer);

        db.ref('pdfs').once('value')
        .then(function(snap) {
            clearTimeout(timer);
            const data = snap.val();
            allPdfs = [];
            allVideos = [];

            if (data) {
                Object.values(data).forEach(function(pdf) {
                    if (pdf && String(pdf.batch_id) === String(batchId) && pdf.category_id === catKey) {
                        if (pdf.type === 'pdf') allPdfs.push(pdf);
                        else allVideos.push(pdf);
                    }
                });
            }

            renderMaterials(document.getElementById('searchInput').value);
        })
        .catch(function(err) {
            clearTimeout(timer);
            showDbError(pdfContainer, err);
            showDbError(videoContainer, err);
        });
    }

    document.getElementById('searchInput').addEventListener('input', function() {
        renderMaterials(this.value);
    });

    // ========================================
    // TAB SWITCHING
    // ========================================
    function showTab(type, el) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById(type + 'Content').classList.add('active');
    }

    loadMaterials();

    // ========================================
    // CHECK MAINTENANCE
    // ========================================
    db.ref('settings/maintenance').on('value', function(snap) {
        if (snap.val() === 'on') {
            document.querySelector('.main-container').innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#0c0c2e,#1a1a3e);color:white;text-align:center;font-family:Arial;padding:20px;">
                    <div style="padding:50px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);max-width:500px;">
                        <div style="font-size:80px;margin-bottom:20px;">🔧</div>
                        <h1 style="font-size:36px;">Under Maintenance</h1>
                        <p style="color:#a5b4fc;">We're updating our content. Please check back soon!</p>
                    </div>
                </div>
            `;
        }
    }, function(err) {
        console.error('Maintenance check failed:', err);
    });

    } // end else (logged in)

    // ========================================
    // LOGOUT
    // ========================================
    function logout() {
        clearUserName();
        window.location.href = 'index.html';
    }

    window.showTab = showTab;
    window.logout = logout;
    </script>
</body>
</html>
