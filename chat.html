<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Message - SK Education</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07111f;--panel:#0c1728;--line:rgba(255,255,255,.08);--text:#eef4ff;--muted:#8fa0b7;--bubble:#17283e;--mine:#6655f2;--accent:#7564ff;--online:#54e5c2}
html,body{width:100%;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:Inter,'Segoe UI',Arial,sans-serif}
#chatApp{height:100dvh;display:flex;flex-direction:column;max-width:700px;margin:auto;border-left:1px solid var(--line);border-right:1px solid var(--line);background:radial-gradient(circle at 20% 8%,rgba(117,100,255,.07),transparent 25%),#07111f}
.header{height:76px;flex:0 0 76px;display:flex;align-items:center;padding:8px 13px;gap:10px;background:rgba(12,23,40,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(18px)}
.header-left{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.back{font-size:34px;color:#dce5f3;width:28px}
.logo{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4361ee,#f72585);font-size:13px;font-weight:800}
h2{font-size:18px;white-space:nowrap}
.sub{font-size:10px;color:var(--online);margin-top:3px}
.menu{position:relative}
.menu>button{width:38px;height:38px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.035);color:#c8d3e2;font-size:23px}
.dropdown{display:none;position:absolute;right:0;top:45px;width:130px;background:#101d30;border:1px solid var(--line);border-radius:13px;padding:5px;z-index:10;box-shadow:0 14px 35px rgba(0,0,0,.35)}
.dropdown.open{display:block}.dropdown button{width:100%;height:36px;background:none;border:0;color:#fff;text-align:left;padding:0 10px;border-radius:8px}
#typing{height:0;opacity:0;overflow:hidden;color:var(--online);font-size:11px;padding-left:18px;transition:.15s;background:#07111f}
#typing.show{height:25px;opacity:1;padding-top:5px}
.messages{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 12px;background:radial-gradient(circle at 25% 25%,rgba(117,100,255,.045),transparent 27%),#07111f}
.row{display:flex;margin:7px 0;align-items:flex-end}
.row.user{justify-content:flex-end}.row.admin{justify-content:flex-start}
.bubble{max-width:min(78%,420px);padding:9px 11px 7px;border-radius:17px 17px 17px 5px;background:var(--bubble);border:1px solid rgba(255,255,255,.05);font-size:14px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.row.user .bubble{background:linear-gradient(135deg,#6655f2,#5545dc);border-radius:17px 17px 5px 17px}
.time{margin-top:4px;text-align:right;font-size:9px;opacity:.6}
.empty{text-align:center;color:#71829a;margin-top:35%;font-size:13px}
.composer{flex:0 0 auto;display:flex;gap:8px;padding:8px 9px calc(9px + env(safe-area-inset-bottom));background:#0a1727;border-top:1px solid var(--line)}
input#msg{flex:1;height:46px;border-radius:15px;border:1px solid var(--line);background:#101e32;color:#fff;padding:0 14px;outline:none;font-size:14px}
input#msg:focus{border-color:rgba(117,100,255,.55);box-shadow:0 0 0 3px rgba(117,100,255,.08)}
.send{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,#7564ff,#5143db);color:#fff;font-size:20px}
@media(max-width:600px){.logo{display:none}.bubble{max-width:82%;font-size:14px}}
</style>
</head>
<body>
<div id="chatApp">
  <div class="header">
    <div class="header-left"><div class="back">‹</div><div class="logo">SK</div><div><h2>SK Education</h2><div class="sub" id="presence">Online</div></div></div>
    <div class="menu"><button onclick="toggleMenu()">⋮</button><div id="drop" class="dropdown"><button onclick="logout()">🚪 Logout</button></div></div>
  </div>
  <div id="typing"></div>
  <div id="messages" class="messages"><div class="empty">Chat loading...</div></div>
  <form id="composer" class="composer"><input id="msg" maxlength="2000" autocomplete="off" placeholder="Message likhein..."><button class="send" type="submit">➤</button></form>
</div>
<script>
const name=getUserName();
if(!name) location.replace("login.html");
const uid=getUserId();
const chatRef=db.ref("chats/"+uid);
const messagesRef=chatRef.child("messages");
const typingRef=chatRef.child("typing");
document.getElementById("presence").textContent="Online • "+name;

function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
function time(v){const d=new Date(v||Date.now());return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}

messagesRef.on("value", snap=>{
  const box=document.getElementById("messages"), data=snap.val()||{};
  const arr=Object.entries(data).sort((a,b)=>(a[1].timestamp||0)-(b[1].timestamp||0));
  box.innerHTML=arr.length?arr.map(([k,m])=>{
    const cls=m.sender==="admin"?"admin":"user";
    return `<div class="row ${cls}"><div class="bubble">${esc(m.message)}<div class="time">${time(m.timestamp)}</div></div></div>`;
  }).join(""):`<div class="empty">💬 Abhi koi message nahi hai.<br>Yahin se chat start karein.</div>`;
  box.scrollTop=box.scrollHeight;
});

function showTyping(on){
  const el=document.getElementById("typing");
  el.textContent=on?"Admin is typing...":"";
  el.classList.toggle("show",on);
}
typingRef.child("admin").on("value",s=>showTyping(s.val()===true));

let typingTimer=null;
function setTyping(){
  typingRef.child("user").set(true).catch(()=>{});
  clearTimeout(typingTimer);
  typingTimer=setTimeout(()=>typingRef.child("user").set(false).catch(()=>{}),1400);
}
document.getElementById("msg").addEventListener("input",()=>{
  if(document.getElementById("msg").value.trim()) setTyping();
  else typingRef.child("user").set(false).catch(()=>{});
});
window.addEventListener("beforeunload",()=>typingRef.child("user").set(false));

document.getElementById("composer").addEventListener("submit",async e=>{
  e.preventDefault();
  const input=document.getElementById("msg"), text=input.value.trim();
  if(!text) return;
  input.disabled=true;
  typingRef.child("user").set(false).catch(()=>{});
  const data={sender:"user",user_id:uid,user_name:name,message:text,timestamp:Date.now()};
  try{
    await chatRef.child("user_name").set(name);
    const newRef=messagesRef.push();
    await newRef.set(data);
    // Telegram is triggered ONLY for an actual user message, never for login.
    notifyNewUserMessage(name,text).catch(err=>console.error("Telegram:",err));
    input.value="";
  }catch(err){alert("Message send nahi hua. Firebase Rules check karein.");console.error(err)}
  finally{input.disabled=false;input.focus();}
});

function toggleMenu(){document.getElementById("drop").classList.toggle("open")}
function logout(){typingRef.child("user").set(false).catch(()=>{});clearUser();location.replace("login.html")}
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))document.getElementById("drop").classList.remove("open")});
</script>
</body>
</html>
