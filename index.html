<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}
body{display:flex;justify-content:center}.gate{width:min(410px,92vw);margin:auto;padding:30px;border-radius:22px;background:#0d192b;border:1px solid #263752;text-align:center;box-shadow:0 20px 60px #0008}.gate .i{font-size:48px}.gate p{color:#91a0b7}.gate input{width:100%;padding:14px;margin:7px 0;border-radius:12px;border:1px solid #31445f;background:#101f34;color:#fff}.gate button{width:100%;padding:14px;border:0;border-radius:12px;background:#635bff;color:#fff;font-weight:bold}.err{height:24px;color:#ff6b8a;margin-top:8px}
.chat{display:none;width:100%;max-width:760px;height:100%;flex-direction:column;background:#091525}.head{height:64px;padding:10px 16px;display:flex;align-items:center;background:#0d1b2e;border-bottom:1px solid #223149}.av{width:42px;height:42px;border-radius:50%;background:#635bff;display:grid;place-items:center;margin-right:10px}.head small{display:block;color:#72ddb9;margin-top:3px}.msgs{flex:1;overflow:auto;padding:14px 12px}.row{display:flex;margin:7px 0}.me{justify-content:flex-end}.b{max-width:80%;padding:9px 11px;border-radius:16px 16px 16px 5px;background:#172a42;white-space:pre-wrap;word-break:break-word}.me .b{background:#635bff;border-radius:16px 16px 5px 16px}.t{display:block;font-size:10px;opacity:.65;text-align:right;margin-top:4px}.compose{display:flex;gap:8px;padding:10px;background:#0d1b2e;border-top:1px solid #223149}.compose input{flex:1;padding:12px 15px;border-radius:22px;border:1px solid #2b3e59;background:#101f34;color:#fff;outline:none}.compose button{width:48px;border:0;border-radius:50%;background:#635bff;color:#fff;font-size:19px}
@media(min-width:760px){.chat{height:94vh;margin:auto;border:1px solid #223149;border-radius:18px;overflow:hidden}}
</style></head><body>
<div class="gate" id="gate"><div class="i">🔐</div><h2>Messages</h2><p>Password daalkar chat open karein</p>
<input id="name" placeholder="Your name (optional)" maxlength="40"><input id="pass" type="password" placeholder="Password"><button id="open">Open Chat</button><div class="err" id="err"></div></div>
<div class="chat" id="chat"><div class="head"><div class="av">👤</div><div><b>Admin</b><small>● Online</small></div></div><div class="msgs" id="msgs"></div>
<form class="compose" id="form"><input id="text" placeholder="Type a message..." autocomplete="off"><button>➤</button></form></div>
<script>
let uid=localStorage.getItem("simple_uid");if(!uid){uid="u_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);localStorage.setItem("simple_uid",uid)}
let userName=localStorage.getItem("simple_name")||"User",ref;
const $=x=>document.getElementById(x), esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
$("open").onclick=async()=>{const p=$("pass").value,n=$("name").value.trim();$("err").textContent="";if(!p)return $("err").textContent="Password enter karein";$("open").disabled=true;
try{if(p!==await loadChatPassword("user")){ $("err").textContent="Wrong password";$("open").disabled=false;return }
if(n){userName=n;localStorage.setItem("simple_name",n)} $("gate").style.display="none";$("chat").style.display="flex";ref=db.ref("chats/"+uid);await ref.update({user_name:userName});load();
}catch(e){console.error(e);$("err").textContent="Chat open nahi ho paya";$("open").disabled=false}};
function load(){ref.child("messages").on("value",s=>{const d=s.val()||{},box=$("msgs");box.innerHTML="";Object.keys(d).sort((a,b)=>new Date(d[a].timestamp)-new Date(d[b].timestamp)).forEach(k=>{const m=d[k],r=document.createElement("div");r.className="row "+(m.sender==="user"?"me":"");r.innerHTML=`<div class="b">${esc(m.text)}<span class="t">${new Date(m.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>`;box.appendChild(r)});box.scrollTop=box.scrollHeight;ref.update({user_read_until:new Date().toISOString()})})}
$("form").onsubmit=async e=>{e.preventDefault();const i=$("text"),t=i.value.trim();if(!t||!ref)return;i.value="";const m={sender:"user",text:t,timestamp:new Date().toISOString()};try{await ref.child("messages").push(m);await ref.update({user_name:userName,last_message:t,last_sender:"user",last_timestamp:m.timestamp});sendTelegramMessage(userName,t).catch(console.warn)}catch(e){i.value=t;alert("Message send nahi ho paya")}};
</script></body></html>
