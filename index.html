<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Messages • Chat</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="config.js"></script>
<style>
:root{--bg:#070b14;--panel:#0c1422;--line:#1e2b41;--text:#f4f7fb;--muted:#8390a5;--accent:#6c63ff;--bubble:#17243a}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(900px 500px at 50% -15%,#25205b55,transparent 60%),var(--bg);color:var(--text)}
button,input{font:inherit}.gate{width:min(430px,92vw);margin:auto;padding:34px 30px 28px;border:1px solid #26344d;border-radius:28px;background:linear-gradient(180deg,#111a2b,#0b1220);box-shadow:0 30px 100px #0009;text-align:center}
.gate .logo{width:76px;height:76px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#3f8cff);font-size:34px;box-shadow:0 15px 40px #6158ff44}
.gate h2{margin:0;font-size:25px}.gate p{color:var(--muted);margin:8px 0 22px}.gate input{width:100%;padding:14px 16px;margin:0 0 10px;border-radius:14px;border:1px solid #2a3953;background:#0a1120;color:#fff;outline:none}
.gate input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6c63ff22}.gate button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--accent),#8178ff);color:#fff;font-weight:800;box-shadow:0 12px 30px #635bff33}
.gate button:disabled{opacity:.6}.err{min-height:22px;color:#ff6684;margin-top:10px;font-size:13px}
.chat{display:none;width:100%;max-width:820px;height:100%;flex-direction:column;background:#09111f}
.head{height:72px;padding:10px 17px;display:flex;align-items:center;background:#0c1625dd;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.av{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#3f8cff);display:grid;place-items:center;margin-right:11px;font-size:20px;box-shadow:0 8px 22px #635bff33}
.head b{font-size:15px}.head small{display:block;color:#47d7a5;margin-top:3px;font-size:11px}.msgs{flex:1;overflow:auto;padding:20px 15px;scroll-behavior:smooth}
.welcome{text-align:center;margin:9vh auto 35px;color:var(--muted);max-width:300px}.welcomeIcon{width:56px;height:56px;margin:auto;display:grid;place-items:center;border-radius:18px;background:#141f33;font-size:25px}.welcome b{display:block;color:#aeb8ca;margin:12px 0 5px}
.row{display:flex;margin:8px 0}.me{justify-content:flex-end}.b{max-width:min(78%,620px);padding:11px 13px;border-radius:18px 18px 18px 6px;background:var(--bubble);border:1px solid #21324b;white-space:pre-wrap;word-break:break-word;line-height:1.42;box-shadow:0 5px 18px #0002}
.me .b{background:linear-gradient(135deg,#6259ed,#756dff);border:0;border-radius:18px 18px 6px 18px;box-shadow:0 8px 22px #635bff2b}.t{display:block;font-size:10px;opacity:.65;text-align:right;margin-top:5px}
.compose{display:flex;gap:9px;padding:12px 14px;background:#0c1625ee;border-top:1px solid var(--line);backdrop-filter:blur(14px)}
.compose input{flex:1;padding:13px 16px;border-radius:17px;border:1px solid #2a3b56;background:#101a2b;color:#fff;outline:none}.compose input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #6c63ff1c}
.compose button{width:48px;height:48px;border:0;border-radius:15px;background:linear-gradient(135deg,var(--accent),#8178ff);color:#fff;font-size:19px;box-shadow:0 10px 25px #635bff33}
@media(min-width:850px){body{display:flex;align-items:center;justify-content:center}.chat{height:94vh;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 30px 100px #0008}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="logo">🔐</div><h2>Private Messages</h2><p>Enter the access password to continue</p>
<input id="name" placeholder="Your name (optional)" maxlength="40" autocomplete="name"><input id="pass" type="password" placeholder="Password" autocomplete="current-password">
<button id="open">Open chat</button><div class="err" id="err"></div></div>

<div class="chat" id="chat"><div class="head"><div class="av">💬</div><div><b>Admin</b><small>● Online</small></div></div>
<div class="msgs" id="msgs"><div class="welcome"><div class="welcomeIcon">👋</div><b>Start a conversation</b><span>Send a message to the admin below.</span></div></div>
<form class="compose" id="form"><input id="text" placeholder="Write a message..." autocomplete="off"><button aria-label="Send">➤</button></form></div>

<script>
let uid=localStorage.getItem("simple_uid");if(!uid){uid="u_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);localStorage.setItem("simple_uid",uid)}
let userName=localStorage.getItem("simple_name")||"User",ref;
const $=x=>document.getElementById(x),esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
$("open").onclick=async()=>{const p=$("pass").value,n=$("name").value.trim();$("err").textContent="";if(!p)return $("err").textContent="Password enter karein";$("open").disabled=true;
try{if(p!==await loadChatPassword("user")){$("err").textContent="Wrong password";$("open").disabled=false;return}if(n){userName=n;localStorage.setItem("simple_name",n)}
$("gate").style.display="none";$("chat").style.display="flex";ref=db.ref("chats/"+uid);await ref.update({user_name:userName});load();$("text").focus()
}catch(e){console.error(e);$("err").textContent="Chat open nahi ho paya";$("open").disabled=false}};
$("pass").addEventListener("keydown",e=>{if(e.key==="Enter")$("open").click()});
function load(){ref.child("messages").on("value",s=>{const d=s.val()||{},box=$("msgs");box.innerHTML="";const keys=Object.keys(d).sort((a,b)=>new Date(d[a].timestamp)-new Date(d[b].timestamp));
if(!keys.length)box.innerHTML='<div class="welcome"><div class="welcomeIcon">👋</div><b>Start a conversation</b><span>Send a message to the admin below.</span></div>';
keys.forEach(k=>{const m=d[k],r=document.createElement("div");r.className="row "+(m.sender==="user"?"me":"");r.innerHTML=`<div class="b">${esc(m.text)}<span class="t">${new Date(m.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>`;box.appendChild(r)});
box.scrollTop=box.scrollHeight;ref.update({user_read_until:new Date().toISOString()})})}
$("form").onsubmit=async e=>{e.preventDefault();const i=$("text"),t=i.value.trim();if(!t||!ref)return;i.value="";const m={sender:"user",text:t,timestamp:new Date().toISOString()};try{await ref.child("messages").push(m);await ref.update({user_name:userName,last_message:t,last_sender:"user",last_timestamp:m.timestamp});sendTelegramMessage(userName,t).catch(console.warn)}catch(e){i.value=t;alert("Message send nahi ho paya")}};
</script></body></html>
