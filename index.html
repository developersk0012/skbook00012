<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK Chat</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
:root{
    --bg1:#070716; --bg2:#120b2e; --bg3:#1c1147;
    --accent1:#4cc9f0; --accent2:#f72585; --accent3:#7b5cff;
    --glass: rgba(255,255,255,0.045);
    --glass-border: rgba(255,255,255,0.08);
    --muted:#98a3c9;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; }
html,body{ height:100%; }
body {
    background: var(--bg1);
    min-height:100vh; color:white; position:relative; overflow-x:hidden;
    background-image:
        radial-gradient(circle at 15% 20%, rgba(76,201,240,0.08), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(123,92,255,0.10), transparent 40%),
        linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
}
body::before, body::after{
    content:''; position:fixed; z-index:-2; border-radius:50%;
    filter: blur(90px); opacity:.55; pointer-events:none;
}
body::before{ width:520px; height:520px; top:-160px; left:-140px; background: radial-gradient(circle, var(--accent3), transparent 70%); animation: floatBlob 14s ease-in-out infinite; }
body::after{ width:480px; height:480px; bottom:-160px; right:-120px; background: radial-gradient(circle, var(--accent2), transparent 70%); animation: floatBlob 16s ease-in-out infinite reverse; }
@keyframes floatBlob{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(40px,30px) scale(1.12);} }

#loginScreen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
.login-container { max-width:420px; width:100%; padding:48px 36px; background:var(--glass); backdrop-filter:blur(24px) saturate(140%); border-radius:28px; border:1px solid var(--glass-border); box-shadow:0 25px 70px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06); animation:fadeUp .5s ease; }
@keyframes fadeUp{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
.login-logo { font-size:62px; text-align:center; margin-bottom:10px; filter:drop-shadow(0 0 18px rgba(76,201,240,0.4)); }
.login-title { font-size:28px; font-weight:800; text-align:center; background:linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; margin-bottom:5px; }
.login-subtitle { color:var(--muted); text-align:center; font-size:14.5px; margin-bottom:28px; }
.login-input-group { margin-bottom:20px; }
.login-input-group label { display:block; color:#a5b4fc; font-size:13.5px; font-weight:600; margin-bottom:6px; }
.login-input-group input { width:100%; padding:15px 18px; border-radius:14px; border:2px solid rgba(255,255,255,0.09); background:rgba(255,255,255,0.045); color:white; font-size:16px; transition:all .25s; }
.login-input-group input:focus { outline:none; border-color:var(--accent3); background:rgba(255,255,255,0.08); box-shadow:0 0 0 4px rgba(123,92,255,0.18); }
.login-input-group input::placeholder { color:#4a5a7a; }
.login-btn { width:100%; padding:17px; background:linear-gradient(90deg, var(--accent3), var(--accent2)); background-size:200% auto; border:none; border-radius:14px; color:white; font-size:17px; font-weight:700; cursor:pointer; transition:all .3s; box-shadow:0 10px 30px rgba(123,92,255,0.3); }
.login-btn:hover { background-position:right center; transform:translateY(-2px); box-shadow:0 14px 36px rgba(247,37,133,0.35); }
.login-btn:active{ transform:translateY(0) scale(.98); }
.login-error { color:#ff6b8b; margin-top:12px; text-align:center; font-size:14px; display:none; }
</style>
</head>
<body>

<div id="loginScreen">
    <div class="login-container">
        <div class="login-logo">💬</div>
        <div class="login-title">SK Chat</div>
        <div class="login-subtitle">Owner se seedha baat karne ke liye apna naam likhein</div>
        <form id="loginForm">
            <div class="login-input-group">
                <label>👤 Aapka Naam</label>
                <input type="text" id="nameInput" placeholder="Apna naam likhein..." required autocomplete="off" maxlength="40">
            </div>
            <button type="submit" class="login-btn">Continue →</button>
            <div id="loginError" class="login-error">⚠️ Kuch galat ho gaya, phir try karein.</div>
        </form>
    </div>
</div>

<script>
// Agar pehle se logged in hain to seedha home pe bhej do
if (isUserLoggedIn()) {
    window.location.href = 'home.html';
}

function setLoginError(msg) {
    const errorDiv = document.getElementById('loginError');
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
}
function clearLoginError() {
    document.getElementById('loginError').style.display = 'none';
}

document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const nameInput = document.getElementById('nameInput');
    // Extra/multiple spaces clean karke ek saaf naam banayein
    const name = nameInput.value.trim().replace(/\s+/g, ' ');
    clearLoginError();

    if (!name) {
        setLoginError('⚠️ Kripya apna naam likhein.');
        nameInput.focus();
        return;
    }
    if (name.length < 2) {
        setLoginError('⚠️ Naam thoda bada likhein (kam se kam 2 characters).');
        nameInput.focus();
        return;
    }
    if (name.length > 40) {
        setLoginError('⚠️ Naam 40 characters se chota rakhein.');
        nameInput.focus();
        return;
    }

    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true;
    btn.textContent = '⏳ Please wait...';

    // Safety net: agar Firebase se koi response 7 second mein nahi aata,
    // to bhi user ko aage jaane dein — button hamesha ke liye atka na rahe.
    let proceeded = false;
    const safetyTimer = setTimeout(function () {
        if (proceeded) return;
        proceeded = true;
        setUserName(name);
        registerOrUpdateUser(name).catch(function () {});
        window.location.href = 'home.html';
    }, 7000);
    function proceedOnce(fn) {
        if (proceeded) return;
        proceeded = true;
        clearTimeout(safetyTimer);
        fn();
    }

    // Block-check pehle, taaki pehle se blocked user login hi na kar sake.
    // Naam ko sirf tabhi save karte hain jab block-check clear ho jaaye.
    isUserBlocked().then(function (blocked) {
        proceedOnce(function () {
            if (blocked) {
                setLoginError('🚫 Aapko is chat se block kar diya gaya hai.');
                btn.disabled = false;
                btn.textContent = 'Continue →';
                return;
            }

            setUserName(name);
            registerOrUpdateUser(name).catch(function (err) {
                console.error('User registry update failed (non-blocking):', err);
            });
            sendLoginNotification(name).catch(function (err) {
                console.error('Login notification failed (non-blocking):', err);
            });
            window.location.href = 'home.html';
        });
    }).catch(function (err) {
        console.warn('isUserBlocked check failed, proceeding anyway:', err);
        proceedOnce(function () {
            // Firebase down ho to bhi block kiye bina aage badhne dein
            setUserName(name);
            registerOrUpdateUser(name).catch(function () {});
            window.location.href = 'home.html';
        });
    });
});
</script>
</body>
</html>
