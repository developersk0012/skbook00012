<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Education - Chat</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0c0c2e 0%, #1a1a3e 50%, #2d1b69 100%); min-height: 100vh; color: white; }

        #loginScreen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .login-container { max-width: 420px; width: 100%; padding: 45px 35px; background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 60px rgba(0,0,0,0.4); animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .login-logo { font-size: 60px; text-align: center; margin-bottom: 10px; }
        .login-title { font-size: 28px; font-weight: 700; text-align: center; background: linear-gradient(90deg, #4cc9f0, #f72585); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px; }
        .login-subtitle { color: #a5b4fc; text-align: center; font-size: 15px; margin-bottom: 25px; }
        .login-input-group { margin-bottom: 18px; }
        .login-input-group label { display: block; color: #a5b4fc; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
        .login-input-group input { width: 100%; padding: 14px 18px; border-radius: 12px; border: 2px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; font-size: 16px; transition: all 0.3s ease; }
        .login-input-group input:focus { outline: none; border-color: #4361ee; background: rgba(255,255,255,0.08); box-shadow: 0 0 0 4px rgba(67,97,238,0.15); }
        .login-input-group input::placeholder { color: #4a5a7a; }
        .login-btn { width: 100%; padding: 16px; background: linear-gradient(90deg, #4361ee, #f72585); border: none; border-radius: 12px; color: white; font-size: 18px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; margin-top: 5px; }
        .login-btn:hover { transform: scale(1.02); box-shadow: 0 8px 30px rgba(67,97,238,0.35); }
        .login-btn:active { transform: scale(0.98); }
        .login-error { color: #f72585; margin-top: 12px; text-align: center; font-size: 14px; display: none; }

        #mainApp { display: none; min-height: 100vh; }
        .main-container { max-width: 1100px; margin: 0 auto; padding: 20px 25px 40px; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 16px 25px; background: rgba(255,255,255,0.04); backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo-icon { width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(135deg, #4361ee, #f72585); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; color: white; box-shadow: 0 4px 15px rgba(67,97,238,0.3); }
        .header-left h2 { font-size: 20px; color: white; margin: 0; }
        .header-left small { color: #a5b4fc; font-size: 13px; display: block; }
        .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .user-badge { background: rgba(67,97,238,0.2); padding: 6px 18px; border-radius: 50px; font-size: 14px; color: #a5b4fc; border: 1px solid rgba(67,97,238,0.15); }
        .icon-btn { background: rgba(255,255,255,0.06); padding: 8px 14px; border-radius: 50px; text-decoration: none; color: #a5b4fc; font-size: 18px; transition: all 0.3s ease; }
        .icon-btn:hover { background: rgba(255,255,255,0.12); color: white; }
        .icon-btn.wa-icon-btn { color: #25d366; }
        .logout-link { background: none; border: none; color: #f72585; font-size: 13px; cursor: pointer; padding: 6px 12px; border-radius: 50px; transition: 0.3s; }
        .logout-link:hover { background: rgba(247,37,133,0.15); }

        .section-title { font-size: 26px; font-weight: 700; margin: 30px 0 20px; background: linear-gradient(90deg, #4cc9f0, #f72585); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .batch-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 15px; }
        .chat-entry-card { background: rgba(255,255,255,0.04); backdrop-filter: blur(8px); border-radius: 18px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275); text-decoration: none; color: white; opacity: 0; animation: cardIn 0.4s ease forwards; border-color: rgba(247,37,133,0.25); }
        .chat-entry-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(247,37,133,0.15); border-color: rgba(247,37,133,0.4); }
        .chat-entry-icon { width: 100%; height: 200px; display: flex; align-items: center; justify-content: center; font-size: 72px; background: linear-gradient(135deg, #4361ee, #f72585); position: relative; }
        .chat-entry-info { padding: 18px 20px 22px; }
        .chat-entry-info h3 { font-size: 18px; margin-bottom: 4px; }
        .chat-entry-info p { color: #a5b4fc; font-size: 14px; margin-bottom: 8px; }
        .chat-entry-badge { display: inline-block; background: rgba(67,97,238,0.2); padding: 3px 14px; border-radius: 50px; font-size: 12px; color: #a5b4fc; }

        @keyframes cardIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        .footer { text-align: center; padding: 30px 20px; color: #6a7a9e; font-size: 13px; margin-top: 10px; }
        .footer a { color: #4cc9f0; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .main-container { padding: 15px; }
            .login-container { padding: 30px 20px; margin: 0 10px; }
            .login-title { font-size: 24px; }
            .header { padding: 12px 16px; flex-direction: column; align-items: stretch; gap: 10px; }
            .header-right { justify-content: center; }
            .batch-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginScreen">
        <div class="login-container">
            <div class="login-logo">📚</div>
            <h2 class="login-title">Welcome to SK Education</h2>
            <p class="login-subtitle">Enter your name to start chatting</p>
            <form id="loginForm">
                <div class="login-input-group">
                    <label>👤 Your Name</label>
                    <input type="text" id="loginName" placeholder="Enter your full name" required>
                </div>
                <button type="submit" class="login-btn">🚀 Continue</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- ===== MAIN APP ===== -->
    <div id="mainApp">
        <div class="main-container">

            <div class="header">
                <div class="header-left">
                    <div class="logo-icon">SK</div>
                    <div>
                        <h2>SK Education</h2>
                        <small>Chat Support</small>
                    </div>
                </div>
                <div class="header-right">
                    <span class="user-badge" id="userDisplay">👋 User</span>
                    <a id="waLinkBtn" href="#" target="_blank" class="icon-btn wa-icon-btn" title="Join WhatsApp Channel">💬</a>
                    <button onclick="logout()" class="logout-link">Logout</button>
                </div>
            </div>

            <h2 class="section-title">💬 Chat Support</h2>
            <div class="batch-grid">
                <a href="chat.html" class="chat-entry-card" style="animation-delay:0s">
                    <div class="chat-entry-icon">💬</div>
                    <div class="chat-entry-info">
                        <h3>Message / Chat</h3>
                        <p>Admin se seedha realtime baat karein</p>
                        <span class="chat-entry-badge">🔔 Tap to Open</span>
                    </div>
                </a>
            </div>

        </div>

        <div class="footer">
            © 2026 SK Education. All Rights Reserved. |
            <a id="waFooterLink" href="#" target="_blank">Join WhatsApp Channel</a>
        </div>
    </div>

    <script>
    const userName = getUserName();

    if (userName) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
        document.getElementById('userDisplay').textContent = '👋 ' + userName;
        document.getElementById('waLinkBtn').href = WHATSAPP_GROUP_LINK;
        document.getElementById('waFooterLink').href = WHATSAPP_GROUP_LINK;
    } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('mainApp').style.display = 'none';
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('loginName').value.trim();
        const errorDiv = document.getElementById('loginError');
        errorDiv.style.display = 'none';

        if (!name) {
            errorDiv.style.display = 'block';
            errorDiv.textContent = '⚠️ Please enter your name!';
            return;
        }

        setUserName(name);

        sendLoginNotification(name).catch(function(err) {
            console.error('Login notification failed:', err);
        });

        location.reload();
    });

    function logout() {
        clearUserName();
        location.reload();
    }

    window.logout = logout;
    </script>
</body>
</html>
