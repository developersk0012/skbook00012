<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Panel - SK Education</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0c0c2e 0%,#1a1a3e 50%,#2d1b69 100%);min-height:100vh;color:#fff;font-family:'Segoe UI',Arial,sans-serif}
.login{max-width:400px;margin:80px auto;padding:45px 35px;background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:24px;border:1px solid rgba(255,255,255,.08);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login .lock{font-size:50px}.login h2{font-size:28px;margin:8px 0 5px}.login p{color:#a5b4fc;margin-bottom:25px}.login input{width:100%;padding:14px 18px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:16px;margin-bottom:15px;outline:none}.login button{width:100%;padding:15px;background:linear-gradient(90deg,#4361ee,#f72585);border:0;border-radius:12px;color:#fff;font-size:18px;font-weight:700}.err{display:none;color:#f72585;margin-top:10px}
.container{max-width:1100px;margin:auto;padding:20px 25px 40px}.header{display:flex;justify-content:space-between;align-items:center;padding:18px 25px;background:rgba(255,255,255,.04);backdrop-filter:blur(12px);border-radius:16px;border:1px solid rgba(255,255,255,.06);margin-bottom:20px}.head-left{display:flex;align-items:center;gap:15px}.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#4361ee,#f72585);font-weight:800}.head-left small{display:block;color:#a5b4fc}.logout{padding:10px 20px;background:rgba(247,37,133,.15);color:#f72585;border:1px solid rgba(247,37,133,.15);border-radius:8px;font-weight:600}
.layout{display:flex;gap:12px;height:calc(100vh - 120px);min-height:520px}.list{width:285px;flex:0 0 285px;background:rgba(12,23,40,.78);border:1px solid rgba(255,255,255,.08);border-radius:18px;overflow-y:auto}.list-head{padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.08);font-weight:700}.item{padding:13px 15px;border-bottom:1px solid rgba(255,255,255,.045);cursor:pointer}.item:hover,.item.active{background:rgba(117,100,255,.12)}.item strong{font-size:14px}.item small{display:block;color:#91a4bc;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item .dot{float:right;width:8px;height:8px;border-radius:50%;background:#f72585;margin-top:5px}
.thread{flex:1;min-width:0;background:#07111f;border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}.thread-head{height:68px;flex:0 0 68px;padding:10px 14px;background:rgba(12,23,40,.94);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;gap:10px}.back{display:none}.thread-head small{display:block;color:#54e5c2;margin-top:3px}.messages{flex:1;min-height:0;overflow-y:auto;padding:14px 12px}.row{display:flex;margin:7px 0}.row.user{justify-content:flex-start}.row.admin{justify-content:flex-end}.bubble{max-width:78%;padding:9px 11px 7px;border-radius:17px 17px 17px 5px;background:#182a41;font-size:14px;line-height:1.38;white-space:pre-wrap;overflow-wrap:anywhere}.row.admin .bubble{background:linear-gradient(135deg,#6655f2,#5545dc);border-radius:17px 17px 5px 17px}.time{font-size:9px;opacity:.6;text-align:right;margin-top:4px}.typing{height:0;opacity:0;color:#54e5c2;font-size:11px;padding-left:14px;overflow:hidden;transition:.15s}.typing.show{height:24px;opacity:1;padding-top:5px}.composer{display:flex;gap:8px;padding:8px 9px 10px;border-top:1px solid rgba(255,255,255,.08);background:#0a1727}.composer input{flex:1;height:46px;border-radius:15px;border:1px solid rgba(255,255,255,.08);background:#101e32;color:#fff;padding:0 14px;outline:none}.composer button{width:46px;height:46px;border:0;border-radius:15px;background:linear-gradient(135deg,#7564ff,#5143db);color:#fff;font-size:20px}
.empty{display:grid;place-items:center;height:100%;color:#71829a;text-align:center}
@media(max-width:768px){.container{padding:10px}.layout{height:calc(100dvh - 100px);min-height:0}.list{width:100%;flex:1}.thread{display:none}.layout.open .list{display:none}.layout.open .thread{display:flex;position:fixed;inset:0;width:100vw;height:100dvh;border:0;border-radius:0;z-index:20}.back{display:block;width:34px;height:34px;border:0;background:rgba(255,255,255,.05);border-radius:10px;color:#fff;font-size:22px}.header{padding:14px 15px}.logout{padding:8px 12px}}
</style>
</head>
<body>
<div id="loginView" class="login">
 <div class="lock">🔐</div><h2>Admin Login</h2><p>Enter admin password to continue</p>
 <form id="adminForm"><input id="pass" type="password" placeholder="Enter password" required><button>Login</button><div id="err" class="err">Invalid password!</div></form>
</div>
<div id="app" style="display:none">
<div class="container">
 <div class="header"><div class="head-left"><div class="logo">SK</div><div><h2>Admin Panel</h2><small>Realtime Chat</small></div></div><button class="logout" onclick="adminLogout()">Logout</button></div>
 <div id="layout" class="layout">
  <div class="list"><div class="list-head">💬 Chats</div><div id="chatList"></div></div>
  <div class="thread">
   <div class="thread-head"><button class="back" onclick="closeThread()">‹</button><div><strong id="threadName">Select a chat</strong><small id="threadSub">Waiting...</small></div></div>
   <div id="adminTyping" class="typing"></div>
   <div id="threadMessages" class="messages"><div class="empty">💬 Select a user to start chatting</div></div>
   <form id="replyForm" class="composer"><input id="reply" maxlength="2000" autocomplete="off" placeholder="Reply likhein..." disabled><button id="send" disabled>➤</button></form>
  </div>
 </div>
</div>
</div>
<script>
let activeUid=null, chatListener=null, typingListener=null, typingTimer=null;
if(sessionStorage.getItem("simple_admin_login")==="1") showAdmin();

document.getElementById("adminForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const p=document.getElementById("pass").value;
 const ok=await loadPassword("settings/adminPassword");
 if(p===ok){sessionStorage.setItem("simple_admin_login","1");showAdmin();}
 else document.getElementById("err").style.display="block";
});
function showAdmin(){
 document.getElementById("loginView").style.display="none";
 document.getElementById("app").style.display="block";
 listenChats();
}
function listenChats(){
 db.ref("chats").on("value",snap=>{
  const box=document.getElementById("chatList"), data=snap.val()||{};
  const arr=Object.entries(data).sort((a,b)=>(b[1].updated_at||0)-(a[1].updated_at||0));
  box.innerHTML=arr.length?arr.map(([id,c])=>{
    const unread=c.last_sender==="user";
    return `<div class="item ${id===activeUid?'active':''}" onclick="openChat('${id}')"><strong>${esc(c.user_name||"User")}</strong>${unread?'<span class="dot"></span>':''}<small>${esc(c.last_message||"No messages")}</small></div>`;
  }).join(""):`<div class="empty" style="height:180px">No chats yet</div>`;
 });
}
function openChat(id){
 activeUid=id;document.getElementById("layout").classList.add("open");
 const chat=db.ref("chats/"+id);
 chatListener&&chatListener();
 chatListener=chat.child("messages").on("value",snap=>{
   const box=document.getElementById("threadMessages"), data=snap.val()||{};
   const arr=Object.values(data).sort((a,b)=>(a.timestamp||0)-(b.timestamp||0));
   box.innerHTML=arr.length?arr.map(m=>`<div class="row ${m.sender==='admin'?'admin':'user'}"><div class="bubble">${esc(m.message)}<div class="time">${fmt(m.timestamp)}</div></div></div>`).join(""):`<div class="empty">No messages yet</div>`;
   box.scrollTop=box.scrollHeight;
 });
 document.getElementById("threadName").textContent="Loading...";
 chat.child("user_name").once("value").then(s=>document.getElementById("threadName").textContent=s.val()||"User");
 document.getElementById("threadSub").textContent="Online chat";
 document.getElementById("reply").disabled=false;document.getElementById("send").disabled=false;
 typingListener&&typingListener();
 typingListener=chat.child("typing/user").on("value",s=>{
   const el=document.getElementById("adminTyping");el.textContent=s.val()?"User is typing...":"";el.classList.toggle("show",s.val()===true);
 });
}
document.getElementById("reply").addEventListener("input",()=>{
 if(!activeUid)return;
 const r=db.ref("chats/"+activeUid+"/typing/admin");
 r.set(!!document.getElementById("reply").value.trim()).catch(()=>{});
 clearTimeout(typingTimer);
 typingTimer=setTimeout(()=>r.set(false).catch(()=>{}),1400);
});
document.getElementById("replyForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!activeUid)return;
 const input=document.getElementById("reply"),text=input.value.trim();if(!text)return;
 const chat=db.ref("chats/"+activeUid), ref=chat.child("messages").push();
 try{
  await ref.set({sender:"admin",message:text,timestamp:Date.now()});
  await chat.update({last_message:text,last_sender:"admin",updated_at:Date.now()});
  chat.child("typing/admin").set(false).catch(()=>{});
  input.value="";input.focus();
 }catch(err){alert("Reply send nahi hua. Firebase Rules check karein.");console.error(err)}
});
function closeThread(){document.getElementById("layout").classList.remove("open")}
function adminLogout(){sessionStorage.removeItem("simple_admin_login");location.reload()}
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
function fmt(v){return new Date(v||Date.now()).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})}
window.addEventListener("beforeunload",()=>{if(activeUid)db.ref("chats/"+activeUid+"/typing/admin").set(false).catch(()=>{})});
</script>
</body>
</html>
