<!doctype html><html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="config.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#07111f;color:#eef5ff}.login{width:min(400px,92vw);margin:80px auto;padding:30px;border-radius:22px;background:#0d192b;border:1px solid #263752;text-align:center}.login .i{font-size:48px}.login input{width:100%;padding:14px;margin:10px 0;border-radius:12px;border:1px solid #31445f;background:#101f34;color:#fff}.login button{width:100%;padding:14px;border:0;border-radius:12px;background:#635bff;color:#fff;font-weight:bold}.err{height:24px;color:#ff6b8a;margin-top:8px}
.panel{display:none;height:100%;max-width:1100px;margin:auto;flex-direction:column}.top{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:#0d1b2e;border-bottom:1px solid #223149}.body{display:flex;flex:1;min-height:0}.list{width:300px;overflow:auto;background:#0b1727;border-right:1px solid #223149}.item{padding:14px;border-bottom:1px solid #1b2a3f;cursor:pointer}.item.active,.item:hover{background:#13243b}.item b,.item small{display:block}.item small{color:#8ea0b8;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread{flex:1;display:flex;flex-direction:column;min-width:0}.th{padding:12px 16px;background:#0d1b2e;border-bottom:1px solid #223149}.th small{display:block;color:#8ea0b8;margin-top:3px}.msgs{flex:1;overflow:auto;padding:14px}.row{display:flex;margin:7px 0}.admin{justify-content:flex-end}.b{max-width:78%;padding:9px 11px;border-radius:16px 16px 16px 5px;background:#172a42;white-space:pre-wrap;word-break:break-word}.admin .b{background:#635bff;border-radius:16px 16px 5px 16px}.t{display:block;font-size:10px;opacity:.65;text-align:right;margin-top:4px}.compose{display:flex;gap:8px;padding:10px;background:#0d1b2e;border-top:1px solid #223149}.compose input{flex:1;padding:12px;border-radius:22px;border:1px solid #2b3e59;background:#101f34;color:#fff}.compose button{width:48px;border:0;border-radius:50%;background:#635bff;color:#fff}@media(max-width:700px){.list{width:115px}.item{padding:10px;font-size:13px}.item small{display:none}}
</style></head><body>
<div class="login" id="login"><div class="i">🛡️</div><h2>Admin Panel</h2><p>Password required</p><input id="pass" type="password" placeholder="Admin password"><button id="go">Login</button><div class="err" id="err"></div></div>
<div class="panel" id="panel"><div class="top"><b>💬 Admin Messages</b><span id="count">0 chats</span></div><div class="body"><div class="list" id="list"></div><div class="thread"><div class="th"><b id="title">Select a chat</b><small id="sub">User chat</small></div><div class="msgs" id="msgs"><div style="text-align:center;color:#71839d;margin-top:50px">Select a user</div></div><form class="compose" id="form"><input id="text" placeholder="Type a message..." autocomplete="off"><button>➤</button></form></div></div></div>
<script>
let active=null,ref=null;const $=x=>document.getElementById(x),esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
$("go").onclick=async()=>{const p=$("pass").value;$("err").textContent="";if(!p)return $("err").textContent="Password enter karein";$("go").disabled=true;try{if(p!==await loadChatPassword("admin")){$("err").textContent="Wrong password";$("go").disabled=false;return}$("login").style.display="none";$("panel").style.display="flex";list()}catch(e){$("err").textContent="Login failed";$("go").disabled=false}};
function list(){db.ref("chats").on("value",s=>{const d=s.val()||{},ks=Object.keys(d);$("count").textContent=ks.length+" chats";const box=$("list");box.innerHTML="";ks.sort((a,b)=>new Date(d[b].last_timestamp||0)-new Date(d[a].last_timestamp||0)).forEach(uid=>{const c=d[uid]||{},el=document.createElement("div");el.className="item"+(uid===active?" active":"");el.innerHTML=`<b>${esc(c.user_name||uid)}</b><small>${esc(c.last_message||"No messages yet")}</small>`;el.onclick=()=>open(uid,c.user_name||"User");box.appendChild(el)})})}
function open(uid,name){active=uid;ref=db.ref("chats/"+uid);$("title").textContent=name;thread();list()}
function thread(){ref.child("messages").on("value",s=>{const d=s.val()||{},box=$("msgs");box.innerHTML="";Object.keys(d).sort((a,b)=>new Date(d[a].timestamp)-new Date(d[b].timestamp)).forEach(k=>{const m=d[k],r=document.createElement("div");r.className="row "+(m.sender==="admin"?"admin":"");r.innerHTML=`<div class="b">${esc(m.text)}<span class="t">${new Date(m.timestamp).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>`;box.appendChild(r)});box.scrollTop=box.scrollHeight;ref.update({admin_read_until:new Date().toISOString()})})}
$("form").onsubmit=async e=>{e.preventDefault();if(!ref)return;const i=$("text"),t=i.value.trim();if(!t)return;i.value="";const m={sender:"admin",text:t,timestamp:new Date().toISOString()};try{await ref.child("messages").push(m);await ref.update({last_message:t,last_sender:"admin",last_timestamp:m.timestamp})}catch(e){i.value=t;alert("Send nahi ho paya")}};
</script></body></html>
